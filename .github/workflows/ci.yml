name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # libclang + libxml2: the `libxml` crate (mintworks-nav dev-tests) runs bindgen.
      # libssl: webauthn-rs-core links openssl unconditionally.
      - run: sudo apt-get update && sudo apt-get install -y libxml2-dev libclang-dev clang pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --check --all
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all
        env:
          PG_TEST_URL: postgres://postgres:postgres@localhost:5432/postgres
      - run: cargo build -p mintworks --features ai,postgres
      # No PG_TEST_URL here: with it set, a postgres build runs these SQLite-dialect suites on PostgreSQL.
      - run: ./target/debug/mintworks test examples/booking/app-rune
      - run: ./target/debug/mintworks test examples/invoicing/app
      - run: ./target/debug/mintworks test examples/subscription/app
      - run: ./target/debug/mintworks test examples/agent-demo
      - run: ./target/debug/mintworks test examples/research/app
      - run: ./target/debug/mintworks test examples/pg-smoke
        env:
          PG_TEST_URL: postgres://postgres:postgres@localhost:5432/postgres

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y libxml2-dev libclang-dev clang pkg-config libssl-dev
      # Keep in step with `rust-version` in Cargo.toml.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo check --all --all-features

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm --filter @mintworks/client test

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: SPDX headers
        run: |
          missing=$(git ls-files '*.rs' '*.ts' '*.tsx' '*.rn' '*.js' | xargs grep -L 'SPDX-License-Identifier' || true)
          if [ -n "$missing" ]; then
            echo "$missing"
            echo "... lack an SPDX-License-Identifier header."
            exit 1
          fi
      - name: No private doc references
        run: |
          if git grep -nE 'claude[-]docs|arch-[0-9]+\)|saas-[0-9]+-' -- ':!adapters/store-sqlite/tests/fixtures/'; then exit 1; fi
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features
