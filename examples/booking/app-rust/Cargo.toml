[package]
name = "booking"
description = "A minimal SaaS built on Mintworks crates: the composition root plus one consumer feature."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "MIT-0"
authors.workspace = true

[dependencies]
mintworks-core.workspace = true
mintworks-auth.workspace = true
mintworks-billing.workspace = true
mintworks-email.workspace = true
mintworks-invoice.workspace = true
mintworks-nav.workspace = true
mintworks-payment-barion.workspace = true
mintworks-store-sqlite.workspace = true

async-trait.workspace = true
axum.workspace = true
# The example only: no `crates/` or `adapters/` crate may read a .env file — the framework
# reads the process environment and nothing else.
dotenvy = "0.15"
hex.workspace = true
serde.workspace = true
sha2.workspace = true
# The one place a consumer names the driver: `impl BookingStore for SqliteStore` binds to it.
sqlx.workspace = true
tokio.workspace = true
ulid.workspace = true
# `fs` is not in the workspace feature list: `ServeDir`/`ServeFile` are the example's need.
tower-http = { workspace = true, features = ["fs"] }
tracing.workspace = true

[dev-dependencies]
http-body-util.workspace = true
# Minting an access token by hand: `tests/flow.rs` drives the router, and registering plus
# activating an account through `mintworks-auth` would be a second feature's worth of fixture.
jsonwebtoken.workspace = true
serde_json.workspace = true
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true

# vim: ts=4
