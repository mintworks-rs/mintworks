[package]
name = "saas-example"
description = "A minimal SaaS built on the saas-framework crates: the composition root plus one consumer feature."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true

[dependencies]
saas-core.workspace = true
saas-auth.workspace = true
saas-billing.workspace = true
saas-email.workspace = true
saas-invoice.workspace = true
saas-nav.workspace = true
payment-adapter-barion.workspace = true
store-adapter-sqlite.workspace = true

async-trait.workspace = true
axum.workspace = true
# The example only: no `crates/` or `adapters/` crate may read a .env file — the framework
# reads the process environment and nothing else.
dotenvy = "0.15"
hex.workspace = true
serde.workspace = true
sha2.workspace = true
# The one place a consumer names the driver: `impl BookingStore for SqliteStore` binds to it.
sqlx.workspace = true
tokio.workspace = true
ulid.workspace = true
# `fs` is not in the workspace feature list: `ServeDir`/`ServeFile` are the example's need.
tower-http = { workspace = true, features = ["fs"] }
tracing.workspace = true

[dev-dependencies]
http-body-util.workspace = true
# Minting an access token by hand: `tests/flow.rs` drives the router, and registering plus
# activating an account through `saas-auth` would be a second feature's worth of fixture.
jsonwebtoken.workspace = true
serde_json.workspace = true
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true

# vim: ts=4
