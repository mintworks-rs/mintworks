[workspace]
resolver = "3"
members = [
	"crates/core",
	"crates/agent",
	"crates/auth",
	"crates/billing",
	"crates/email",
	"crates/entitle",
	"crates/invoice",
	"crates/llm",
	"crates/memory",
	"crates/nav",
	"crates/pdf",
	"crates/plans",
	"crates/search",
	"crates/script",
	"adapters/store-sqlite",
	"adapters/store-postgres",
	"testing/store-conformance",
	"testing/access-matrix",
	"adapters/appdb-sqlite",
	"adapters/appdb-postgres",
	"adapters/payment-barion",
	"adapters/search-linkup",
	"adapters/search-searxng",
	"adapters/fetch-jina",
	"bin/mintworks",
	"examples/booking/app-rust",
	"examples/native-module",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.94"
license = "MPL-2.0"
publish = false
authors = ["Szilárd Hajba <szilu@symbion.hu>"]
repository = "https://github.com/mintworks-rs/mintworks"
homepage = "https://mintworks.symbion.hu"
readme = "README.md"

[workspace.dependencies]
wiremock = "0.6"
mintworks-core = { version = "0.5.0", path = "crates/core" }
mintworks-agent = { version = "0.5.0", path = "crates/agent" }
mintworks-auth = { version = "0.5.0", path = "crates/auth" }
mintworks-billing = { version = "0.5.0", path = "crates/billing" }
mintworks-email = { version = "0.5.0", path = "crates/email" }
mintworks-entitle = { version = "0.5.0", path = "crates/entitle" }
mintworks-invoice = { version = "0.5.0", path = "crates/invoice" }
mintworks-llm = { version = "0.5.0", path = "crates/llm" }
mintworks-memory = { version = "0.5.0", path = "crates/memory" }
mintworks-nav = { version = "0.5.0", path = "crates/nav" }
mintworks-pdf = { version = "0.5.0", path = "crates/pdf" }
mintworks-plans = { version = "0.5.0", path = "crates/plans" }
mintworks-search = { version = "0.5.0", path = "crates/search" }
mintworks-script = { version = "0.5.0", path = "crates/script" }
mintworks-store-sqlite = { version = "0.5.0", path = "adapters/store-sqlite" }
mintworks-store-postgres = { version = "0.5.0", path = "adapters/store-postgres" }
mintworks-store-conformance = { path = "testing/store-conformance" }
mintworks-appdb-sqlite = { version = "0.5.0", path = "adapters/appdb-sqlite" }
mintworks-appdb-postgres = { version = "0.5.0", path = "adapters/appdb-postgres" }
mintworks-payment-barion = { version = "0.5.0", path = "adapters/payment-barion" }
mintworks-search-linkup = { version = "0.5.0", path = "adapters/search-linkup" }
mintworks-search-searxng = { version = "0.5.0", path = "adapters/search-searxng" }
mintworks-fetch-jina = { version = "0.5.0", path = "adapters/fetch-jina" }

aes = "0.9"
aes-gcm = "0.11"
argon2 = "0.6"
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
# Already in the tree through sqlx; named for `TryStreamExt` on a row stream.
futures-util = { version = "0.3", default-features = false }
handlebars = "6"
hkdf = "0.13"
hmac = "0.13"
hex = "0.4"
libxml = "0.3"
http-body-util = "0.1"
# ring, matching lettre's rustls provider: two providers in one process is a runtime panic.
hyper = { version = "1.12", features = ["client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["native-tokio", "http1", "tls12", "ring"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
lettre = { version = "0.11.23", default-features = false, features = [
	"builder", "rustls-tls", "tokio1", "tokio1-rustls", "smtp-transport",
] }
parking_lot = "0.12"
# `default-features = false` drops the `getopts` CLI and the HTML renderer; mintworks-pdf only walks events.
pulldown-cmark = { version = "0.13", default-features = false }
quick-xml = "0.42"
# Pre-1.0: a minor bump is a breaking bump, so the pin is exact and is not to be widened.
rune = "=0.14.2"
# `statvfs` for `A-DISK-LOW`. A safe wrapper, which `unsafe_code = "forbid"` below makes the
# only option short of shelling out to `df`.
rustix = { version = "1", features = ["fs"] }
sha2 = "0.11"
sha3 = "0.12"
typst = "=0.15.0"
typst-assets = { version = "=0.15.0", features = ["fonts"] }
typst-pdf = "=0.15.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = [
	"sqlite", "runtime-tokio", "macros", "json",
] }
# Must stay inside sqlx-sqlite's range (`links = "sqlite3"` allows one copy); bump with sqlx only.
libsqlite3-sys = { version = "0.37", features = ["bundled"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time"] }
ulid = "3"
# `danger-allow-state-serialisation` is not optional here: the WebAuthn challenge state travels
# as a client-held blob, so it has to serialize (D20/D21).
# `conditional-ui` for the usernameless discoverable flow (`DiscoverableKey`,
# `start_discoverable_authentication`), which is `cfg`-gated away without it.
webauthn-rs = { version = "0.5", features = ["conditional-ui", "danger-allow-state-serialisation"] }

[workspace.lints.rust]
unsafe_code = "forbid"
ambiguous_negative_literals = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
module_name_repetitions = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
uninlined_format_args = "allow"
similar_names = "allow"
unused_async = "allow"
too_many_lines = "allow"

# This is a money codebase: a silent wrap is worse than a panic, and `release-lto` inherits
# from here. It turns the unchecked `Money` arithmetic impls into panics in release too.
[profile.release]
overflow-checks = true

[profile.release-lto]
opt-level = "s"
inherits = "release"
lto = true
codegen-units = 1
strip = true
