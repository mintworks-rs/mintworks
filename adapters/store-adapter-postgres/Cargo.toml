[package]
name = "store-adapter-postgres"
description = "PostgreSQL store adapter for saas-framework: opens the reader and writer pools."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["saas", "postgres", "sqlx", "adapter"]
categories = ["database"]

[dependencies]
saas-core.workspace = true
serde_json.workspace = true
saas-auth.workspace = true
saas-billing.workspace = true
saas-invoice.workspace = true
saas-agent = { workspace = true, optional = true }
saas-llm = { workspace = true, optional = true }
saas-nav.workspace = true
saas-entitle.workspace = true
saas-pdf.workspace = true
saas-plans.workspace = true
saas-search = { workspace = true, optional = true }
async-trait.workspace = true
# PostgreSQL is enabled here and only here, so no build that did not ask for it compiles it.
sqlx = { workspace = true, features = ["postgres"] }
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
store-conformance.workspace = true

[features]
# The AI crates; `saas-run --features ai` enables it.
ai = ["dep:saas-agent", "dep:saas-llm", "dep:saas-search", "store-conformance/ai"]

[lints]
workspace = true

# vim: ts=4
