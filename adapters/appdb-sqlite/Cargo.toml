[package]
name = "mintworks-appdb-sqlite"
description = "SQLite database for a Rune script's own tables: a separate file from the framework store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["saas", "sqlite", "sqlx", "adapter", "rune"]
categories = ["database"]

[dependencies]
mintworks-core.workspace = true
# The crate that defines `AppDb`, and the only framework crate this one names: depending on
# `mintworks-store-sqlite` would reconnect the two databases this crate exists to keep apart.
mintworks-script.workspace = true
async-trait.workspace = true
futures-util.workspace = true
serde_json.workspace = true
sqlx.workspace = true
# `bundled`, so `cargo test -p mintworks-appdb-sqlite` alone links the same SQLite the store
# adapter does rather than whatever the system happens to carry.
libsqlite3-sys.workspace = true
tokio.workspace = true
tracing.workspace = true
mintworks-agent = { workspace = true, optional = true }
mintworks-memory = { workspace = true, optional = true }

[dev-dependencies]
mintworks-store-conformance.workspace = true

[features]
# The AI crates; `mintworks --features ai` enables it.
ai = ["dep:mintworks-agent", "dep:mintworks-memory", "mintworks-store-conformance/ai"]

[lints]
workspace = true

# vim: ts=4
