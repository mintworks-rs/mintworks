[licenses]
allow = [
	"MIT",
	"MIT-0",
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"ISC",
	"Zlib",
	"Unicode-3.0",
	"0BSD",
	"BSL-1.0",
	"CDLA-Permissive-2.0",
	"MPL-2.0",
]

[advisories]
version = 2
# Unmaintained, not vulnerable; pulled in transitively with no maintained replacement upstream yet.
ignore = [
	{ id = "RUSTSEC-2025-0141", reason = "bincode: unmaintained, transitive" },
	{ id = "RUSTSEC-2024-0436", reason = "paste: unmaintained, transitive" },
	{ id = "RUSTSEC-2026-0206", reason = "rustybuzz: unmaintained, via typst" },
	{ id = "RUSTSEC-2026-0192", reason = "ttf-parser: unmaintained, via typst" },
	{ id = "RUSTSEC-2024-0320", reason = "yaml-rust: unmaintained, transitive" },
	# Ignored by ID, so for every version: drop these once typst leaves quick-xml 0.38.
	{ id = "RUSTSEC-2026-0194", reason = "quick-xml 0.38 via typst's citationberg; ours is 0.41" },
	{ id = "RUSTSEC-2026-0195", reason = "quick-xml 0.38 via typst's citationberg; ours is 0.41" },
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
