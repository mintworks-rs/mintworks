[licenses]
allow = [
	"MIT",
	"MIT-0",
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"ISC",
	"Zlib",
	"Unicode-3.0",
	"0BSD",
	"BSL-1.0",
	"CDLA-Permissive-2.0",
	"MPL-2.0",
]

[advisories]
version = 2
# Unmaintained, not vulnerable; pulled in transitively with no maintained replacement upstream yet.
ignore = [
	{ id = "RUSTSEC-2025-0141", reason = "bincode: unmaintained, transitive" },
	{ id = "RUSTSEC-2024-0436", reason = "paste: unmaintained, transitive" },
	{ id = "RUSTSEC-2026-0206", reason = "rustybuzz: unmaintained, via typst" },
	{ id = "RUSTSEC-2026-0192", reason = "ttf-parser: unmaintained, via typst" },
	{ id = "RUSTSEC-2024-0320", reason = "yaml-rust: unmaintained, transitive" },
	{ id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml: unmaintained, via typst's hayagriva" },
	# jsonwebtoken's `rust_crypto` feature links rsa/p256 unconditionally; we only sign HS256.
	{ id = "RUSTSEC-2023-0071", reason = "rsa via jsonwebtoken; RSA algorithms unused" },
	{ id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 via jsonwebtoken's p256; ECDSA unused" },
	# Fix is libsqlite3-sys 0.39; sqlx-sqlite 0.9.0 caps it <0.38. Drop when sqlx allows 0.39.
	{ id = "RUSTSEC-2026-0459", reason = "SQLite crafted-WAL read; we open only our own data dir's files" },
	# Ignored by ID, so for every version: drop these once typst leaves quick-xml 0.38.
	{ id = "RUSTSEC-2026-0194", reason = "quick-xml 0.38 via typst's citationberg; ours is 0.41" },
	{ id = "RUSTSEC-2026-0195", reason = "quick-xml 0.38 via typst's citationberg; ours is 0.41" },
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
