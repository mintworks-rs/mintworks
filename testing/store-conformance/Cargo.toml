mintworks-plans.workspace = true
mintworks-script.workspace = true
mintworks-agent.workspace = true
mintworks-llm.workspace = true
mintworks-memory.workspace = true
mintworks-search.workspace = true
serde_json.workspace = true
tokio.workspace = true

[features]
# A cfg switch only: optional deps here are dropped by cargo inside the dev-dependency cycle
# (crates/agent → adapter → mintworks-store-conformance), so `cargo test --all` lost them.
ai = []

[lints]
workspace = true
