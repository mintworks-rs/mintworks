[package]
name = "saas-core"
description = "Shared foundation for the saas-framework crates: errors, value types, ids, money."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["saas", "framework", "axum"]
categories = ["web-programming"]

[dependencies]
aes-gcm.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
hex.workspace = true
hkdf.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
jsonwebtoken.workspace = true
parking_lot.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "signal", "time"] }
tower-http.workspace = true
# `HttpConnector`'s resolver bound is `tower_service::Service<Name>`, which `http::NoLinkLocal`
# implements.
tower-service = "0.3"
tracing.workspace = true
tracing-subscriber.workspace = true
ulid.workspace = true

[dev-dependencies]
sqlx.workspace = true
# Dev-only, and a cycle Cargo permits: `tests/core.rs` needs a concrete adapter behind
# `Arc<dyn CoreStore>`.
store-adapter-sqlite.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }
wiremock.workspace = true

[lints]
workspace = true
