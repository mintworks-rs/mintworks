[package]
name = "mintworks-script"
description = "Rune scripting over Mintworks service handles."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["saas", "framework", "scripting", "rune"]
categories = ["web-programming"]

[dependencies]
mintworks-core.workspace = true
mintworks-auth.workspace = true
mintworks-billing.workspace = true
mintworks-email.workspace = true
mintworks-invoice.workspace = true
mintworks-pdf.workspace = true
mintworks-entitle.workspace = true
mintworks-plans.workspace = true
mintworks-nav.workspace = true
mintworks-llm = { workspace = true, optional = true }
mintworks-memory = { workspace = true, optional = true }
mintworks-search = { workspace = true, optional = true }
mintworks-agent = { workspace = true, optional = true }
async-trait.workspace = true
axum.workspace = true
http-body-util.workspace = true
rune.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower.workspace = true
tracing.workspace = true

[dev-dependencies]
# Both adapters are dev-only here, and the cycle is one Cargo permits: `tests/routes.rs` drives the compiled bundle through a
# real router over a real store, which no `#[cfg(test)]` build can (the impls would not unify).
mintworks-store-sqlite = { path = "../../adapters/store-sqlite" }
mintworks-appdb-sqlite = { path = "../../adapters/appdb-sqlite" }
sqlx.workspace = true
jsonwebtoken.workspace = true
# `start_paused`, for the deadline test in `vm.rs`.
tokio = { workspace = true, features = ["test-util"] }

[features]
# The AI crates; `mintworks --features ai` enables it.
ai = ["dep:mintworks-llm", "dep:mintworks-memory", "dep:mintworks-agent", "dep:mintworks-search"]

[lints]
workspace = true
