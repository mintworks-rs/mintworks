# Dev-only, and not a cycle: `saas-invoice` depends on `saas-core` alone. One test mounts
# `saas_invoice::routes::org_invoices()` to prove `consent_gated_router` reaches another
# crate's bundle.
saas-invoice.workspace = true
sqlx.workspace = true
# Dev-only, and a cycle Cargo permits: `tests/auth_flows.rs` needs a concrete adapter behind
# `Arc<dyn AuthStore>`.
store-adapter-sqlite.workspace = true
tower = { version = "0.5", features = ["util"] }

