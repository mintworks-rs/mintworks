[package]
name = "saas-run"
description = "Serves a complete SaaS application from a directory of Rune sources: no Rust file in the application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true

[dependencies]
saas-core.workspace = true
saas-auth.workspace = true
saas-billing.workspace = true
saas-email.workspace = true
saas-invoice.workspace = true
saas-pdf.workspace = true
saas-entitle.workspace = true
saas-plans.workspace = true
saas-nav.workspace = true
saas-script.workspace = true
saas-agent = { workspace = true, optional = true }
saas-llm = { workspace = true, optional = true }
saas-memory = { workspace = true, optional = true }
saas-search = { workspace = true, optional = true }
# A composition root may name the adapter: `TxHook` needs the concrete transaction API, which
# `saas-script` cannot reach without becoming SQLite-only.
store-adapter-sqlite.workspace = true
# And the script's own database, which is a different file behind a different adapter — that
# separation is what keeps a `db::` statement out of the framework's tables.
appdb-adapter-sqlite.workspace = true
# Or a PostgreSQL database, selected at boot by a `postgres://` `APP_DB_URL`.
appdb-adapter-postgres = { workspace = true, optional = true }
# Likewise the framework's own database, selected by a `postgres://` `DB_URL`.
store-adapter-postgres = { workspace = true, optional = true }
# The same reason: a gateway's credentials need a root that names it, and `saas-run` is that
# root for a Rune application.
payment-adapter-barion.workspace = true
# And the search engines, which `saas-search` names only by the id they register.
search-adapter-linkup = { workspace = true, optional = true }
search-adapter-searxng = { workspace = true, optional = true }
fetch-adapter-jina = { workspace = true, optional = true }

async-trait.workspace = true
axum.workspace = true
# The binary only: no `crates/` or `adapters/` crate may read a .env file — the framework reads
# the process environment and nothing else.
dotenvy = "0.15"
# `legal/*.md` is versioned by its own digest, so editing a file republishes it.
hex.workspace = true
sha2.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
# `fs` is not in the workspace feature list: `ServeDir`/`ServeFile` are a served-SPA need.
tower-http = { workspace = true, features = ["fs"] }
jsonwebtoken.workspace = true
sqlx.workspace = true

[features]
# Off by default: the booking and invoicing images ship no LLM client.
ai = [
	"dep:saas-agent",
	"dep:saas-llm",
	"dep:saas-memory",
	"dep:saas-search",
	"dep:search-adapter-linkup",
	"dep:search-adapter-searxng",
	"dep:fetch-adapter-jina",
	"saas-script/ai",
	"store-adapter-sqlite/ai",
	"appdb-adapter-sqlite/ai",
	"appdb-adapter-postgres?/ai",
	"store-adapter-postgres?/ai",
]
# Off by default, like `ai`: no build compiles a PostgreSQL driver unless it asked for one.
postgres = ["dep:appdb-adapter-postgres", "dep:store-adapter-postgres"]

[lints]
workspace = true

